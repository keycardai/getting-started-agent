[project]
name = "getting-started-agent"
version = "0.1.0"
description = "A LangGraph agent that authenticates to Keycard as itself"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1.0",
    "keycardai-oauth>=0.33.1,<0.34",
    "langchain==1.4.6",
    "langchain-anthropic==1.7.6",
    "langgraph==1.2.16",
    "python-dotenv>=1.2,<2.0",
]

[project.scripts]
getting-started-agent = "getting_started_agent.main:run"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
